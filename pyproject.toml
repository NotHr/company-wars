[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-comany_fights"
version = "0.1.0"
description = "Comany Fights environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "openenv-core[core]>=0.2.2",
    # Environment-specific dependencies
    # Add all dependencies needed for your environment here
    # Examples:
    # "numpy>=1.19.0",
    # "torch>=2.0.0",
    # "gymnasium>=0.29.0",
    # "openspiel>=1.0.0",
    # "smolagents>=1.22.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
train = [
    # Core training stack
    "torch>=2.1.0",
    "transformers>=4.45.0",
    "trl>=0.12.0",
    "peft>=0.13.0",
    "accelerate>=0.34.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.44.0",
    # Monitoring + plots
    "wandb>=0.18.0",
    "matplotlib>=3.8.0",
    # Unsloth — comment out if wheel unavailable for your CUDA version
    # Install separately: pip install unsloth[colab-new]
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m comany_fights.server.app
server = "comany_fights.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["comany_fights", "comany_fights.server"]
package-dir = { "comany_fights" = ".", "comany_fights.server" = "server" }